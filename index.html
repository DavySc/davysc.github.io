<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    
    <script src="coi-serviceworker.js"></script>

    <script src="https://unpkg.com/@ffmpeg/ffmpeg@0.12.10/dist/umd/ffmpeg.js"></script>
    <script src="https://unpkg.com/@ffmpeg/util@0.12.1/dist/umd/index.js"></script>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FFMPEG // WASM_CORE</title>
    <style>
        :root {
            --bg: #0d0d0d;
            --term-bg: #1a1a1a;
            --text: #e0e0e0;
            --accent: #00ff41; 
            --warn: #ffb000;
            --border: 1px solid #333;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            padding: 2rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 800px;
        }

        header {
            border-bottom: var(--border);
            padding-bottom: 1rem;
            margin-bottom: 2rem;
            display: flex;
            justify-content: space-between;
        }

        h1 { margin: 0; font-size: 1.2rem; text-transform: uppercase; letter-spacing: 2px; }
        .status { color: var(--accent); font-weight: bold; }
        .status.busy { color: var(--warn); animation: blink 1s infinite; }

        /* Drop Zone */
        .drop-zone {
            border: 2px dashed #444;
            background: var(--term-bg);
            padding: 3rem;
            text-align: center;
            margin-bottom: 1.5rem;
            cursor: pointer;
            transition: 0.2s;
        }
        .drop-zone:hover, .drop-zone.dragover {
            border-color: var(--accent);
            background: #222;
        }
        input[type="file"] { display: none; }

        /* Controls */
        .controls {
            display: flex;
            gap: 1rem;
            margin-bottom: 1.5rem;
        }

        button {
            flex: 1;
            background: transparent;
            border: 1px solid var(--accent);
            color: var(--accent);
            padding: 1rem;
            font-family: inherit;
            text-transform: uppercase;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }
        
        button:hover { background: var(--accent); color: var(--bg); }
        button:disabled { border-color: #555; color: #555; cursor: not-allowed; }

        /* Terminal Output */
        .terminal {
            background: black;
            border: var(--border);
            height: 250px;
            overflow-y: auto;
            padding: 1rem;
            font-size: 0.85rem;
            white-space: pre-wrap;
            margin-bottom: 1.5rem;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.8);
        }
        .log-entry { margin: 2px 0; color: #888; }
        .log-entry.info { color: var(--accent); }

        /* Result Area */
        .result {
            text-align: center;
            padding: 1rem;
            border-top: var(--border);
        }
        img { max-width: 100%; border: var(--border); }

        @keyframes blink { 50% { opacity: 0.5; } }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>FFmpeg // Local_Instance</h1>
        <span id="status" class="status">[ LOADING CORE... ]</span>
    </header>

    <div class="drop-zone" id="drop-zone">
        [ DROP VIDEO FILE HERE ]
        <input type="file" id="file-input">
    </div>

    <div class="controls">
        <button id="btn-audio" disabled>Extract AAC (Copy)</button>
        <button id="btn-gif" disabled>Generate HD GIF</button>
    </div>

    <div class="terminal" id="terminal">
        <div class="log-entry">> System initialized.</div>
        <div class="log-entry">> Waiting for WASM core...</div>
    </div>

    <div class="result" id="result-area"></div>
</div>

<script src="./app.js"></script>

</body>
</html>
